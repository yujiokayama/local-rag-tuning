#   category: 前回記事の分類 pinpoint=一点集中型 / paraphrase=言い換え / overview=複数文書横断
#   q13 は expected_keywords が空なので「正答率」には常に不正解で入る → 回答は目視で判定する
- id: q01
  type: single
  category: pinpoint
  question: フレックスタイム制のコアタイムは何時から何時までですか？
  expected_files:
