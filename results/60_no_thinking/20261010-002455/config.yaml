data:
  docs_dir: data/docs
  questions: eval/questions.yaml
ollama:
  base_url: http://localhost:11434
  llm: qwen3:14b
  embed: bge-m3
  context_window: 8192
  temperature: 0
  seed: 42
  request_timeout: 600
  thinking: false
  keep_alive: 10m
  num_predict: 4096
chunk:
  splitter: sentence_ja
  chunk_size: 512
  chunk_overlap: 64
retrieval:
  mode: vector
  top_k: 4
  hybrid:
    vector_top_k: 10
    bm25_top_k: 10
    tokenizer: fugashi
    rrf_k: 60
rerank:
  enabled: false
  model: BAAI/bge-reranker-v2-m3
  top_n: 4
  device: null
prompt:
  template: default
eval:
  hit_k: 4
description: qwen3 の思考をオフ（速度と正答の変化を見る）
name: 60_no_thinking
